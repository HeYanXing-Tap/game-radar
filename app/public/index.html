<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>游戏资讯雷达</title>
    <link rel="stylesheet" href="style.css?v=1795773340449" />
  </head>
  <body>
    <header class="top">
      <div class="inner mastrow">
        <h1>游戏资讯雷达</h1>
        <p class="sub"><span id="statline"></span></p>
      </div>
      <div class="inner navrow">
        <nav class="tabs" id="tabs">
          <button data-view="topic" class="on">选题</button>
          <button data-view="game">重点游戏</button>
          <button data-view="archive">存档</button>
          <button data-view="sources">信源</button>
        </nav>
        <div class="controls">
          <select id="days">
            <option value="1">近 24 小时</option>
            <option value="3" selected>近 3 天</option>
            <option value="7">近 7 天</option>
            <option value="14">近 14 天</option>
          </select>
          <label class="chk"><input type="checkbox" id="all" /> 含未过门槛</label>
        </div>
      </div>
    </header>

    <main class="inner">
      <section id="view-topic" class="view"></section>
      <section id="view-game" class="view hidden"></section>
      <section id="view-archive" class="view hidden"></section>
      <section id="view-sources" class="view hidden"></section>
    </main>

    <script type="module" src="app.js?v=1795773340449"></script>
  </body>
</html>
